- aid: rfid:gs1-epcis-api
  name: GS1 EPCIS API
  description: >-
    The Electronic Product Code Information Services (EPCIS) is GS1's standard for sharing supply chain
    visibility data. EPCIS 2.0 supports REST/HTTP and JSON-LD for capturing and querying RFID events including
    Object, Aggregation, Transaction, Transformation, and Association events.
  humanURL: https://www.gs1.org/standards/epcis
