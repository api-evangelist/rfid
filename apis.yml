aid: rfid
name: RFID
kind: topic
description: >-
  Radio-Frequency Identification (RFID) is an automatic identification technology that uses radio waves to read and
  capture information stored on a tag attached to an object. RFID powers supply chain visibility, inventory management,
  asset tracking, access control, and contactless payments. The RFID ecosystem includes hardware vendors (Zebra, Impinj,
  Alien Technology), software platforms (ClearStream, TagMatiks, Jetstream), and open standards (GS1 EPCIS, EPC Tag Data
  Standard, ISO 18000 series).
